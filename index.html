<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maurice Moynihan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="original%20files/fonts-googleapis-com/css2" rel="stylesheet">
<link rel="stylesheet" href="original%20files/mauricemoynihan-com/style.css">
<style>
  .hero__liquid{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;}
  html.liquid-live .hero__liquid{display:block;}
  html.liquid-live .hero .wordmark span{color:transparent;}
  html.liquid-wait .hero .wordmark span{color:transparent;}
</style>
<script>
/* hide the plain type until liquid.js has painted a frame; if it never does, bring the type back after 3s */
document.documentElement.classList.add('trail-live');
(function(){
  var d=document.documentElement, c=document.createElement('canvas');
  if(!(c.getContext&&c.getContext('2d')))return;
  d.classList.add('liquid-wait');
  setTimeout(function(){ if(!d.classList.contains('liquid-live'))d.classList.remove('liquid-wait'); },3000);
})();
</script>
</head>
<body>
<main id="content">
  <div class="hero-stage" id="hero-stage">
    <section class="hero" id="hero" aria-label="Introduction">
      <div class="hero__name">
        <h1 class="wordmark"><span>Maurice</span> <span>Moynihan</span><canvas class="hero__liquid" aria-hidden="true"></canvas></h1>
      </div>
    </section>
  </div>
</main>
<script src="original%20files/mauricemoynihan-com/liquid.js"></script>
</body>
</html>
