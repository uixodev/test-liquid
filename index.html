<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Type — personal experiment</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#efede6;color:#161511;font-family:Arial,sans-serif}
main{height:100%;display:grid;place-items:center;overflow:hidden;position:relative}
canvas{width:100%;height:100%;position:absolute;inset:0;touch-action:none}
small{position:absolute;bottom:24px;left:0;right:0;text-align:center;pointer-events:none;opacity:.5;font-size:12px}
</style></head><body><main><canvas id="stage"></canvas><small>MOVE YOUR CURSOR THROUGH THE INK · INDEPENDENT RECREATION</small></main>
<script type="module">
// EDIT THESE SETTINGS. The original letter outlines are kept intact until the cursor bends them.
const settings={text:"LIQUID",ink:"#161511",radius:90,push:24,stiffness:.075,damping:.86,fontScale:.21,resolution:1};
const canvas=document.querySelector("canvas"),pencil=canvas.getContext("2d");
const source=document.createElement("canvas"),brush=source.getContext("2d",{willReadFrequently:true});
const result=document.createElement("canvas"),output=result.getContext("2d");
let width=0,height=0,sw=0,sh=0,alpha=null,image=null;
const pointer={x:-10000,y:-10000,lastX:-10000,lastY:-10000};
const motion={x:0,y:0,vx:0,vy:0,active:false};
function build(){
 width=canvas.clientWidth;height=canvas.clientHeight;
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
 pencil.setTransform(dpr,0,0,dpr,0,0);
 const scale=Math.max(.5,Math.min(1,settings.resolution));
 sw=Math.max(1,Math.round(width*scale));sh=Math.max(1,Math.round(height*scale));
 source.width=result.width=sw;source.height=result.height=sh;
 brush.clearRect(0,0,sw,sh);
 let size=Math.min(width*settings.fontScale,240)*scale;
 brush.font=`900 ${size}px Arial`;
 while(brush.measureText(settings.text).width>sw*.91){size*=.95;brush.font=`900 ${size}px Arial`;}
 brush.fillStyle="#000";brush.textAlign="center";brush.textBaseline="middle";
 brush.fillText(settings.text,sw/2,sh/2);
 const rgba=brush.getImageData(0,0,sw,sh).data;
 alpha=new Uint8Array(sw*sh);
 for(let i=0;i<alpha.length;i++)alpha[i]=rgba[i*4+3];
 image=brush.createImageData(sw,sh);
 const color=settings.ink.match(/[a-f\d]{2}/gi);
 const rgb=color&&color.length===3?color.map(c=>parseInt(c,16)):[22,21,17];
 for(let i=0;i<alpha.length;i++){const j=i*4;image.data[j]=rgb[0];image.data[j+1]=rgb[1];image.data[j+2]=rgb[2];}
}
function sample(x,y){
 if(x<0||y<0||x>=sw-1||y>=sh-1)return 0;
 const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,k=iy*sw+ix;
 return (alpha[k]*(1-fx)+alpha[k+1]*fx)*(1-fy)+(alpha[k+sw]*(1-fx)+alpha[k+sw+1]*fx)*fy;
}
function frame(){
 const scale=sw/width;
 // Cursor movement gives the ink an impulse; springs bring it back.
 if(pointer.x>-1000){
  if(pointer.lastX>-1000){
   const dx=pointer.x-pointer.lastX,dy=pointer.y-pointer.lastY;
   motion.vx+=Math.max(-35,Math.min(35,dx))*.24;
   motion.vy+=Math.max(-35,Math.min(35,dy))*.24;
  }
  motion.x=pointer.x*scale;motion.y=pointer.y*scale;motion.active=true;
 }else{motion.active=false;}
 motion.vx-=motion.vx*settings.stiffness;
 motion.vy-=motion.vy*settings.stiffness;
 motion.vx*=settings.damping;motion.vy*=settings.damping;
 const strength=settings.push*scale;
 const radius=settings.radius*scale;
 const mvx=motion.vx*scale,mvy=motion.vy*scale;
 const data=image.data;
 // Inverse warp samples the original anti-aliased letters rather than drawing dots.
 // Only a circular area around the cursor is displaced; other letters stay crisp.
 for(let y=0;y<sh;y++){
  for(let x=0;x<sw;x++){
   let sx=x,sy=y;
   if(motion.active){
    const dx=x-motion.x,dy=y-motion.y;
    const distance=Math.hypot(dx,dy);
    if(distance<radius){
     const t=1-distance/radius;
     const falloff=t*t*(3-2*t);
     const outward=strength*falloff;
     const norm=distance||1;
     sx=x-(dx/norm)*outward-mvx*falloff;
     sy=y-(dy/norm)*outward-mvy*falloff;
    }
   }
   data[(y*sw+x)*4+3]=sample(sx,sy);
  }
 }
 output.putImageData(image,0,0);
 pencil.clearRect(0,0,width,height);
 pencil.imageSmoothingEnabled=true;
 pencil.drawImage(result,0,0,width,height);
 pointer.lastX=pointer.x;pointer.lastY=pointer.y;
 requestAnimationFrame(frame);
}
canvas.addEventListener("pointermove",e=>{
 const r=canvas.getBoundingClientRect();
 pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;
});
canvas.addEventListener("pointerleave",()=>{pointer.x=-10000;pointer.y=-10000;pointer.lastX=-10000;pointer.lastY=-10000;});
window.addEventListener("resize",build);
window.liquidSettings=settings;
build();frame();
</script></body></html>
